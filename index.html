    <meta name="description" content="HOYO-MiX Online 是一个米哈游游戏原声带数据网站，收录 HOYO-MiX 团队为《原神》、《崩坏》系列等作品创作的原声音乐，支持在线试听、专辑浏览、歌曲检索、创建与分享歌单。">

    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#f5f7fa" />
    <script>
      (() => {
        let mode = 'system'
        try {
          const saved = JSON.parse(localStorage.getItem('theme') || 'null')
          if (['system', 'light', 'dark'].includes(saved?.mode))
            mode = saved.mode
        }
        catch {}
        const dark = mode === 'dark' || (mode === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.toggle('dark', dark)
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
        document.querySelector('meta[name="theme-color"]').setAttribute('content', dark ? '#111827' : '#f5f7fa')
      })()
    </script>
